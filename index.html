  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ljste.github.io/">
  <meta property="og:title" content="Lucas Steinmetz — Software Engineer">

  <meta property="og:site_name" content="Lucas Steinmetz">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Lucas Steinmetz — Software Engineer">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Lucas Steinmetz",
    "url": "https://ljste.github.io/",
    "jobTitle": "Software Engineer",
    "sameAs": [
      "https://github.com/ljste",
      "https://www.linkedin.com/in/lsteinm/"
    ],
    "affiliation": {
      "@type": "CollegeOrUniversity",
      "name": "Villanova University"
    },
    "knowsAbout": [
      "Software engineering",
      "Systems programming",
      "Cybersecurity",
      "Cloud infrastructure",
      "Artificial intelligence"
    ]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#command">Skip to terminal input</a>

  <main class="terminal" id="terminal" aria-label="Lucas Steinmetz interactive portfolio terminal">
    <section id="terminal-output" role="log" aria-live="polite" aria-relevant="additions text"></section>

    <form id="command-form" autocomplete="off">
      <div id="input-line">
        <span class="prompt" aria-hidden="true">C:\Users\visitor&gt;</span>
        <div id="input-wrapper">
          <label class="sr-only" for="command">Enter a portfolio command</label>
          <input
            id="command"
            name="command"
            type="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            aria-describedby="terminal-hint"
            autofocus
          >
          <span id="cursor" aria-hidden="true"></span>
        </div>
      </div>
    </form>

    <p id="terminal-hint" class="sr-only">Type help and press Enter to see all available commands. Use the up and down arrow keys for command history.</p>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
